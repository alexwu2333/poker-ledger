<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153d31"><title>牌桌账本</title><link rel="stylesheet" href="style.css"></head>
<body>
<main><header><div class="breadcrumb"><strong>♠ 牌桌账本</strong><span id="sessionTitle"></span></div><div class="header-actions"><button class="button small" id="sessionsBtn">历史场次</button><button class="button small" id="resetBtn">清空 / 新场</button></div></header>
<div class="content"><section class="panel" id="tableView"><div class="panel-head"><div><h2>玩家账本 <span id="playerCount">0 人</span></h2></div><button class="button setting" id="settingsBtn"><span>每手筹码</span><strong id="rateLabel">1,000</strong><span class="setting-edit">设置</span></button><div class="actions"><button class="button" id="transferBtn">↔ 玩家转手</button><button class="button green" id="addPlayerBtn">＋ 添加玩家</button></div></div><div class="table-wrap"><table><thead><tr><th>玩家</th><th>每手筹码</th><th>买入 / 手</th><th>卖出 / 手</th><th>净买入 / 手</th><th>最终筹码</th><th>输赢 / 筹码</th><th>操作</th></tr></thead><tbody id="playersBody"></tbody></table></div><div id="emptyState" class="empty"><p>暂无玩家</p><button class="button green" id="firstPlayerBtn">＋ 添加第一位玩家</button><button class="text-button" id="demoBtn">查看示例</button></div><div class="panel-foot"><span id="tableFoot"></span><button class="text-button" id="csvBtn">导出本场 CSV ↗</button></div></section><section class="metrics" aria-label="实时汇总"><article class="metric primary"><div>桌上现有</div><strong id="onTableHands">0 <small>手</small></strong><p id="onTableChips">0 筹码</p></article><article class="metric"><div>累计买入</div><strong id="totalBuy">0 <small>手</small></strong></article><article class="metric"><div>累计卖出</div><strong id="totalSell">0 <small>手</small></strong></article><article class="metric"><div>已结算离场</div><strong id="departedChips">0</strong><p id="departedCount">0 人 · 带走的剩余筹码</p></article></section><section class="panel" id="settlementView"><div class="panel-head"><div><h2>全桌结算</h2></div><button class="button" id="exportSettlement">导出结算 CSV</button></div><div id="reconcile" class="reconcile"></div><div class="panel-foot"><span>含提前离场玩家</span><button class="button green" id="finishBtn">核对并完成本场</button></div></section><section class="panel" id="historyView"><div class="panel-head"><h2>买卖流水 <span id="entryCount">0</span></h2></div><div id="historyList" class="history-list"></div></section>
<footer><span id="saveState" role="status">已保存到本机</span><div><button class="text-button" id="backup">导出备份</button><button class="text-button" id="restore">导入备份</button></div></footer><input id="importFile" type="file" accept=".json,application/json" hidden>
</div></main><dialog id="modal"><div class="dialog-top"><h2 id="modalTitle"></h2><button class="icon-button" id="closeModal" aria-label="关闭">×</button></div><form id="modalForm"><div id="modalContent"></div><p class="error" id="formError" role="alert"></p><div class="dialog-actions"><button type="button" class="button" id="cancelModal">取消</button><button type="submit" class="button green" id="submitModal">确认</button></div></form></dialog><div id="toast" class="toast" role="status" hidden></div>
<script src="model.js"></script><script src="app.js"></script></body></html>
